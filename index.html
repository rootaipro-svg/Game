<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي عباقرة العلوم</title>
    <style>
        :root {
            --bg-color: #1e272e;
            --box-bg: #2d3436;
            --text-color: #f5f6fa;
            --accent: #ffdd59;
            --correct: #05c46b;
            --wrong: #ff3f34;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--accent);
            font-size: 36px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 221, 89, 0.5);
        }

        .quiz-container {
            background-color: var(--box-bg);
            width: 100%;
            max-width: 700px;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 2px solid #575fcf;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 18px;
            color: #d2dae2;
            border-bottom: 1px solid #485460;
            padding-bottom: 10px;
        }

        .question-text {
            font-size: 24px;
            line-height: 1.5;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background-color: #3c40c6;
            color: white;
            border: 2px solid transparent;
            padding: 15px 20px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            text-align: right;
            transition: 0.3s;
            font-family: inherit;
            display: flex;
            align-items: center;
        }

        .option-btn:hover {
            background-color: #575fcf;
            transform: translateX(-5px);
        }

        .option-btn.correct {
            background-color: var(--correct);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(5, 196, 107, 0.5);
        }

        .option-btn.wrong {
            background-color: var(--wrong);
            border-color: #fff;
            opacity: 0.7;
        }

        .explanation {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(255, 221, 89, 0.1);
            border-right: 4px solid var(--accent);
            border-radius: 5px;
            font-size: 16px;
            line-height: 1.6;
        }

        .next-btn {
            display: none;
            margin-top: 25px;
            background-color: var(--accent);
            color: #1e272e;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }

        .next-btn:hover {
            background-color: #ffd32a;
        }

        #result-screen {
            display: none;
            text-align: center;
        }

        .medal {
            font-size: 80px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🧠 تحدي العباقرة 🧠</h1>
        <p>أسئلة استنتاجية في العلوم (الطقس والروافع)</p>
    </div>

    <div class="quiz-container" id="quiz-box">
        <div class="question-header">
            <span id="q-level">المستوى: متوسط</span>
            <span id="q-counter">السؤال 1 من 5</span>
        </div>
        
        <div class="question-text" id="question-text">جاري التحميل...</div>
        
        <div class="options-grid" id="options-container">
            </div>

        <div class="explanation" id="explanation-box"></div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">السؤال التالي</button>
    </div>

    <div class="quiz-container" id="result-screen">
        <div class="medal" id="medal-icon">🏆</div>
        <h2 style="color: var(--accent); font-size: 32px;">انتهى التحدي!</h2>
        <p style="font-size: 24px;">لقد أجبت بشكل صحيح على:</p>
        <h1 id="final-score" style="font-size: 48px; margin: 10px 0;">0 / 5</h1>
        <p id="result-message" style="font-size: 20px; margin-bottom: 30px;"></p>
        <button class="next-btn" style="display: block;" onclick="location.reload()">تحدي جديد 🔄</button>
    </div>

    <script>
        const questions = [
            {
                level: "متوسط 🟡",
                text: "في محطة الأرصاد، لماذا نستخدم الأنيمومتر ودوارة الرياح معاً ولا نكتفي بجهاز واحد؟",
                options: [
                    "لأن أحدهما يقيس سرعة الرياح والآخر يحدد اتجاهها.",
                    "احتياطاً في حال تعطل أحد الجهازين أثناء العاصفة.",
                    "لأن الأنيمومتر يقيس الحرارة ودوارة الرياح تقيس السرعة.",
                    "لأنهما يقيسان نفس الشيء ولكن أحدهما أكثر دقة."
                ],
                correctIndex: 0,
                explanation: "💡 تفسير: الرياح لها صفتان مهمتان (السرعة والاتجاه). الأنيمومتر بأكوابه الدوارة يحسب السرعة، ودوارة الرياح بسهمها تحدد الاتجاه الذي تأتي منه الرياح."
            },
            {
                level: "متوسط 🟡",
                text: "الشاكوش والقلم كلاهما من الروافع، لكنهما يختلفان علمياً. ما هو الاختلاف؟",
                options: [
                    "الشاكوش رافعة من النوع الثاني والقلم من النوع الأول.",
                    "الشاكوش رافعة من النوع الأول والقلم من النوع الثالث.",
                    "كلاهما من النوع الثالث ولكن يختلفان في الحجم.",
                    "القلم ليس رافعة لأنه لا يرفع أثقالاً."
                ],
                correctIndex: 1,
                explanation: "💡 تفسير: في الشاكوش (عند نزع المسمار) تكون نقطة الارتكاز في المنتصف (نوع أول). أما عند الكتابة بالقلم، فإننا نمسكه من المنتصف بقوة أصابعنا (القوة في المنتصف = نوع ثالث)."
            },
            {
                level: "صعب 🔴",
                text: "نعلم أن (الروافع توفر الجهد). ولكن جناح الطائر (رافعة من النوع الثالث) لا يوفر الجهد! فما الفائدة منه للطائر؟",
                options: [
                    "يقلل من وزن الطائر في الهواء.",
                    "يحمي الطائر من الحيوانات المفترسة.",
                    "يعمل على زيادة المسافة والسرعة ليتمكن من الطيران.",
                    "يساعد الطائر على حفظ توازنه فقط ولا علاقة له بالطيران."
                ],
                correctIndex: 2,
                explanation: "💡 تفسير: روافع النوع الثالث (حيث القوة في المنتصف) لا توفر الجهد أبداً، بل تحتاج لجهد كبير، ولكن فائدتها العظيمة هي (زيادة المسافة والسرعة) مما يمنح الطائر الدفع اللازم للطيران."
            },
            {
                level: "صعب 🔴",
                text: "كيف يمكن لجهاز (البارومتر) أن ينذرنا باقتراب عاصفة شديدة؟",
                options: [
                    "عندما ترتفع درجة حرارته فجأة.",
                    "عندما يبدأ بالدوران بسرعة كبيرة.",
                    "عندما يمتلئ بالماء من الأمطار.",
                    "عندما تنخفض قراءة الضغط الجوي فيه بشكل مفاجئ."
                ],
                correctIndex: 3,
                explanation: "💡 تفسير: البارومتر يقيس الضغط الجوي. عندما ينخفض الضغط الجوي فجأة، فهذا يعني أن الهواء يرتفع لأعلى بسرعة تاركاً فراغاً ستندفع إليه الرياح بقوة، مما يعني قدوم عاصفة."
            },
            {
                level: "تحدي العباقرة 💥",
                text: "فأس الحطاب أداة لقطع الخشب. أين تقع (القوة) التي يبذلها الحطاب عند استخدامه للفأس؟ وما نوع هذه الرافعة؟",
                options: [
                    "القوة في الرأس الحديدي (نوع ثاني).",
                    "القوة في اليد التي تمسك أسفل المقبض (نوع أول).",
                    "القوة في اليد التي تتحرك في منتصف المقبض الخشبي (نوع ثالث).",
                    "الفأس يعتمد على وزنه فقط ولا يعتبر رافعة."
                ],
                correctIndex: 2,
                explanation: "💡 تفسير: يد الحطاب السفلية هي نقطة الارتكاز، واليد العليا التي تدفع الفأس في المنتصف هي (القوة)، والرأس الحديدي الذي يضرب الخشب هو (المقاومة). بما أن القوة في المنتصف فهو نوع ثالث!"
            }
        ];

        let currentQ = 0;
        let score = 0;
        let isAnswered = false;

        function loadQuestion() {
            isAnswered = false;
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('explanation-box').style.display = 'none';
            
            const q = questions[currentQ];
            document.getElementById('q-level').innerText = "المستوى: " + q.level;
            document.getElementById('q-counter').innerText = `السؤال ${currentQ + 1} من ${questions.length}`;
            document.getElementById('question-text').innerText = q.text;

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, btnElement) {
            if (isAnswered) return;
            isAnswered = true;

            const q = questions[currentQ];
            const allButtons = document.querySelectorAll('.option-btn');

            if (selectedIndex === q.correctIndex) {
                btnElement.classList.add('correct');
                score++;
            } else {
                btnElement.classList.add('wrong');
                allButtons[q.correctIndex].classList.add('correct');
            }

            // إظهار التفسير العلمي بعد الإجابة
            const expBox = document.getElementById('explanation-box');
            expBox.innerText = q.explanation;
            expBox.style.display = 'block';

            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentQ++;
            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-box').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            
            document.getElementById('final-score').innerText = `${score} / ${questions.length}`;
            
            const msgEl = document.getElementById('result-message');
            const medalEl = document.getElementById('medal-icon');

            if (score === 5) {
                medalEl.innerText = "👑";
                msgEl.innerText = "عبقري لا يُشق له غبار! إجاباتك وتحليلاتك العلمية مذهلة.";
            } else if (score >= 3) {
                medalEl.innerText = "🥈";
                msgEl.innerText = "أداء ممتاز! لديك عقلية علمية قوية، استمر في البحث والتفكير.";
            } else {
                medalEl.innerText = "💡";
                msgEl.innerText = "تحدي صعب أليس كذلك؟ المهم أنك تعلمت معلومات جديدة اليوم!";
            }
        }

        // بدء الاختبار
        loadQuestion();
    </script>
</body>
</html>
