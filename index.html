<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار العلوم الممتع - الصف الخامس</title>
    <style>
        :root {
            --primary: #0984e3;
            --secondary: #00b894;
            --danger: #d63031;
            --background: #dfe6e9;
            --text: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 32px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .quiz-container {
            background: white;
            width: 100%;
            max-width: 600px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            padding: 30px;
            text-align: center;
        }

        .question-text {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            color: var(--text);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .option-btn {
            background-color: #f1f2f6;
            border: 2px solid #ced6e0;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .option-btn:hover {
            background-color: #eccc68;
            border-color: #ffa502;
        }

        .option-btn.correct {
            background-color: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }

        .option-btn.wrong {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .controls {
            margin-top: 30px;
            display: none;
        }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .next-btn:hover {
            background-color: #74b9ff;
        }

        .score-container {
            display: none;
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }

        .progress {
            margin-bottom: 15px;
            font-size: 16px;
            color: #636e72;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🔬 اختبار العلوم الممتع 🌍</h1>
        <p>مراجعة وحدتي (الطقس) و (الروافع) - المنهج اليمني</p>
    </div>

    <div class="quiz-container" id="quiz-box">
        <div class="progress" id="progress">السؤال 1 من 6</div>
        <div class="question-text" id="question">جاري تحميل السؤال...</div>
        
        <div class="options-grid" id="options">
            </div>

        <div class="controls" id="controls">
            <button class="next-btn" onclick="nextQuestion()">السؤال التالي ➡️</button>
        </div>
    </div>

    <div class="quiz-container score-container" id="score-box">
        <h2>🎉 انتهى الاختبار!</h2>
        <p>نتيجتك هي:</p>
        <h1 id="final-score" style="font-size: 48px; color: #00b894;">0 / 6</h1>
        <button class="next-btn" onclick="location.reload()" style="margin-top: 20px;">إعادة الاختبار 🔄</button>
    </div>

    <script>
        // الأسئلة مستخرجة بدقة من صور دليل المعلم المرفقة
        const quizData = [
            {
                question: "ما هو الجهاز المستخدم لقياس درجة حرارة الجو؟ 🌡️",
                options: ["البارومتر", "الترمومتر", "الأنيمومتر", "دوارة الرياح"],
                correct: "الترمومتر"
            },
            {
                question: "أي من الأجهزة التالية يستخدم لقياس سرعة الرياح؟ 💨",
                options: ["الأنيمومتر", "الهيتوجراف", "دوارة الرياح", "الترمومتر المئوي"],
                correct: "الأنيمومتر"
            },
            {
                question: "يعتبر (الشاكوش) من الأمثلة على الروافع من النوع... 🔨",
                options: ["النوع الأول", "النوع الثاني", "النوع الثالث", "ليس رافعة"],
                correct: "النوع الأول"
            },
            {
                question: "بناءً على ما تعلمته، القلم والفأس من الروافع التابعة للنوع... ✏️",
                options: ["النوع الأول", "النوع الثاني", "النوع الثالث", "جميع ما سبق"],
                correct: "النوع الثالث"
            },
            {
                question: "جناح الطائر يمثل رافعة من أي نوع؟ 🦅",
                options: ["النوع الأول", "النوع الثاني", "النوع الثالث", "النوع الرابع"],
                correct: "النوع الثالث"
            },
            {
                question: "ما هو الجهاز المخصص لقياس الضغط الجوي؟ 🌍",
                options: ["الترمومتر", "البارومتر", "دوارة الرياح", "مقياس المطر"],
                correct: "البارومتر"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const progressEl = document.getElementById('progress');
        const controlsEl = document.getElementById('controls');
        const quizBox = document.getElementById('quiz-box');
        const scoreBox = document.getElementById('score-box');
        const finalScoreEl = document.getElementById('final-score');

        function loadQuestion() {
            answered = false;
            controlsEl.style.display = "none";
            
            const currentQuiz = quizData[currentQuestionIndex];
            questionEl.innerText = currentQuiz.question;
            progressEl.innerText = `السؤال ${currentQuestionIndex + 1} من ${quizData.length}`;
            
            optionsEl.innerHTML = "";
            
            currentQuiz.options.forEach(option => {
                const button = document.createElement('button');
                button.innerText = option;
                button.classList.add('option-btn');
                button.onclick = () => checkAnswer(button, option, currentQuiz.correct);
                optionsEl.appendChild(button);
            });
        }

        function checkAnswer(button, selected, correct) {
            if (answered) return; // منع الإجابة أكثر من مرة
            answered = true;

            const allButtons = optionsEl.querySelectorAll('.option-btn');
            
            if (selected === correct) {
                button.classList.add('correct');
                score++;
            } else {
                button.classList.add('wrong');
                // تظليل الإجابة الصحيحة باللون الأخضر
                allButtons.forEach(btn => {
                    if (btn.innerText === correct) {
                        btn.classList.add('correct');
                    }
                });
            }

            controlsEl.style.display = "block"; // إظهار زر "السؤال التالي"
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showScore();
            }
        }

        function showScore() {
            quizBox.style.display = "none";
            scoreBox.style.display = "block";
            finalScoreEl.innerText = `${score} / ${quizData.length}`;
            
            if (score === quizData.length) {
                finalScoreEl.innerText += " \nأنت عالم المستقبل! 🌟";
            } else if (score >= quizData.length / 2) {
                finalScoreEl.innerText += " \nعمل جيد، واصل التدريب! 👍";
            } else {
                finalScoreEl.innerText += " \nتحتاج إلى مراجعة الدروس أكثر يا بطل! 📚";
            }
        }

        // بدء الاختبار
        loadQuestion();
    </script>
</body>
</html>
