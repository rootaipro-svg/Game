<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الأبطال الثلاثة</title>
    <style>
        :root {
            --yamani-color: #ff4757;
            --saleh-color: #2ed573;
            --abdullah-color: #1e90ff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2f3542;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        h1 { margin: 10px; font-size: 24px; text-shadow: 2px 2px 5px #000; }

        #race-track {
            width: 90%;
            max-width: 800px;
            flex-grow: 1;
            background: #57606f;
            border: 4px solid #fff;
            border-radius: 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 20px 0;
            margin-bottom: 20px;
        }

        .lane {
            height: 80px;
            border-bottom: 2px dashed rgba(255,255,255,0.2);
            position: relative;
            display: flex;
            align-items: center;
        }

        .finish-line {
            position: absolute;
            right: 50px;
            top: 0;
            bottom: 0;
            width: 10px;
            background: repeating-linear-gradient(45deg, #fff, #fff 10px, #000 10px, #000 20px);
        }

        .player {
            position: absolute;
            left: 20px;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            transition: left 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        #p1 { background: var(--yamani-color); }
        #p2 { background: var(--saleh-color); }
        #p3 { background: var(--abdullah-color); }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            active: transform: scale(0.9);
        }

        #btn1 { background: var(--yamani-color); }
        #btn2 { background: var(--saleh-color); }
        #btn3 { background: var(--abdullah-color); }

        #reset-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 5px 15px;
            background: #ffa502;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* رسالة الفوز */
        #winner-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
    </style>
</head>
<body>

    <button id="reset-btn" onclick="resetGame()">إعادة السباق 🔄</button>
    <h1>🚀 تحدي سباق الأبطال الثلاثة</h1>

    <div id="race-track">
        <div class="finish-line"></div>
        
        <div class="lane">
            <div id="p1" class="player">يماني</div>
        </div>
        <div class="lane">
            <div id="p2" class="player">صالح</div>
        </div>
        <div class="lane">
            <div id="p3" class="player">عبدالله</div>
        </div>
    </div>

    <div class="controls">
        <button id="btn1" class="btn" onmousedown="move(1)">يماني (A)</button>
        <button id="btn2" class="btn" onmousedown="move(2)">صالح (S)</button>
        <button id="btn3" class="btn" onmousedown="move(3)">عبدالله (D)</button>
    </div>

    <p>يمكن اللعب بالضغط على الأزرار الملونة، أو لوحة المفاتيح (A, S, D)</p>

    <div id="winner-overlay">
        <h2 id="winner-text" style="font-size: 40px;"></h2>
        <button class="btn" style="background: #2ed573;" onclick="resetGame()">لعب مرة أخرى 🏁</button>
    </div>

    <script>
        const positions = { 1: 20, 2: 20, 3: 20 };
        const step = 30; // المسافة التي يقطعها البطل في كل ضغطة
        let gameFinished = false;

        function move(playerNum) {
            if (gameFinished) return;

            const trackWidth = document.getElementById('race-track').offsetWidth;
            const finishPos = trackWidth - 150; // خط النهاية

            positions[playerNum] += step;
            const playerElement = document.getElementById('p' + playerNum);
            playerElement.style.left = positions[playerNum] + 'px';

            if (positions[playerNum] >= finishPos) {
                announceWinner(playerNum);
            }
        }

        // دعم لوحة المفاتيح للمنافسة السريعة
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key === 'a') move(1);
            if (key === 's') move(2);
            if (key === 'd') move(3);
        });

        function announceWinner(num) {
            gameFinished = true;
            const names = { 1: 'يماني', 2: 'صالح', 3: 'عبدالله' };
            const overlay = document.getElementById('winner-overlay');
            const winText = document.getElementById('winner-text');
            
            winText.innerText = "🏆 الفائز هو البطل: " + names[num];
            overlay.style.display = 'flex';
        }

        function resetGame() {
            gameFinished = false;
            document.getElementById('winner-overlay').style.display = 'none';
            for (let i = 1; i <= 3; i++) {
                positions[i] = 20;
                document.getElementById('p' + i).style.left = '20px';
            }
        }
    </script>
</body>
</html>
